<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>LiveMira Demo</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #1d1810;
        color: #fff8ee;
        font:
          16px/1.5 -apple-system,
          BlinkMacSystemFont,
          'PingFang SC',
          'Noto Sans SC',
          system-ui,
          sans-serif;
      }
      .landing {
        box-sizing: border-box;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-content: center;
        gap: 18px;
        padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
        max-width: 460px;
        margin: 0 auto;
      }
      h1 {
        margin: 0;
        font-size: 30px;
        letter-spacing: 0.01em;
      }
      h1 small {
        display: block;
        font-size: 14px;
        font-weight: 500;
        color: rgba(255, 248, 238, 0.65);
        margin-top: 4px;
      }
      p {
        margin: 0;
        color: rgba(255, 248, 238, 0.8);
      }

      a {
        color: #f2b49d;
      }
      .meta {
        font-size: 12px;
        color: rgba(255, 248, 238, 0.5);
      }
    </style>
  </head>
  <body>
    <main class="landing" id="landing">
      <h1>LiveMira<small id="version"></small></h1>
      <p>
        Scan a photo, see a video. <a href="targets.html" target="_blank">Target images here</a> — open on another
        screen or print.
      </p>
      <p class="meta" id="build"></p>
    </main>
    <script type="module" src="demo.js"></script>
  </body>
</html>
