name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: wasm32-unknown-unknown
      - run: npm install
      - run: npm run check
      - name: Verify the release checksums
        # The demo's sample pictures (demo/assets/*.png) are not in the repository.
        run: cd release/0.5.0 && grep -v '  demo/assets/[^/]*\.png$' SHA256SUMS | shasum -a 256 -c
